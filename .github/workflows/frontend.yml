name: Frontend

# Solo se ejecuta cuando cambian archivos del frontend.
on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        # npm install (no npm ci): el arbol de Angular 18 mezcla chokidar 3 y 4 y
        # genera un lock que el `npm ci` estricto rechaza (bug conocido de npm).
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
