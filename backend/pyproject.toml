[project]
name = "maya-predice-backend"
version = "0.1.0"
description = "Backend FastAPI para predicción del Mundial 2026 (Dixon-Coles)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI usa Depends() en defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
