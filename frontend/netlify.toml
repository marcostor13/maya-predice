# Configuración de despliegue en Netlify para el frontend Angular.

[build]
  base = "frontend/"
  # npm install (no npm ci): el arbol de Angular 18 mezcla chokidar 3 y 4, y npm
  # genera un lock que el `npm ci` estricto rechaza (bug conocido de npm). npm
  # install resuelve el arbol correctamente y construye sin problema.
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist/maya-predice/browser"

[build.environment]
  NODE_VERSION = "20"

# Redirección SPA: todas las rutas sirven index.html (Angular router las maneja).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
