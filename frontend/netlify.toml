# Configuración de despliegue en Netlify para el frontend Angular.

[build]
  base = "frontend/"
  # npm install (no npm ci): el arbol de Angular 18 mezcla chokidar 3 y 4, y npm
  # genera un lock que el `npm ci` estricto rechaza (bug conocido de npm). npm
  # install resuelve el arbol correctamente y construye sin problema.
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist/maya-predice/browser"
  # Solo construye/despliega si hubo cambios en frontend/ (base dir).
  # El comando corre desde el base dir; `git diff --quiet` devuelve 0 (sin
  # cambios) -> Netlify cancela el build; 1 (con cambios) -> construye.
  ignore = "git diff --quiet HEAD^ HEAD -- ."

[build.environment]
  NODE_VERSION = "20"

# Proxy a la API pública de ESPN. Netlify (no el backend de Coolify) hace de
# proxy del lado servidor, así que el navegador lo consume mismo-origen (sin
# CORS) y sin tocar la allowlist de Coolify. DEBE ir ANTES del catch-all `/*`
# (las reglas se evalúan en orden).
[[redirects]]
  from = "/proxy/espn/*"
  to = "https://site.api.espn.com/:splat"
  status = 200

# Proxy a la API de MediaWiki (Wikipedia). Mismo patrón que ESPN: Netlify hace de
# proxy del lado servidor, así que el navegador lo consume mismo-origen (sin CORS)
# y sin tocar la allowlist de Coolify. Lo usa `wiki-squad.service.ts` para extraer
# plantillas + fotos cuando el backend no las trae. DEBE ir ANTES del catch-all.
[[redirects]]
  from = "/proxy/wiki/*"
  to = "https://en.wikipedia.org/:splat"
  status = 200

# Redirección SPA: todas las rutas sirven index.html (Angular router las maneja).
# Catch-all: SIEMPRE el último.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
